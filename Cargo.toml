[package]
name = "ingrid_core"
version = "1.3.1"
edition = "2021"
license = "MIT"
description = "Crossword-generating library and CLI tool"
repository = "https://github.com/rf-/ingrid_core"
readme = "README.md"

[dependencies]
smallvec = "1.8.0"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
lazy_static = "1.4.0"
float-ord = "0.3.2"
rand = { version = "0.10.0", features = ["std", "alloc", "std_rng"] }
clap = { version = "4.0.15", features = ["derive"], optional = true }
serde = { version = "1.0", optional = true }
serde_derive = { version = "1.0", optional = true }
unicode-normalization = "0.1.22"
tempfile = { version = "3", optional = true }
fancy-regex = "0.17"
either = "1.15.0"
unicode_categories = "0.1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.0", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.4.0" }

[dev-dependencies]
ingrid_core = { path = ".", features = ["serde"] }
serde_json = "1.0.89"
indoc = "2.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.dev]
codegen-units = 1
lto = true
opt-level = 3

[profile.test]
codegen-units = 1
lto = true
opt-level = 3

[lib]
name = "ingrid_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "ingrid_core"
path = "src/bin.rs"
required-features = ["cli"]

[features]
check_invariants = []
serde = ["dep:serde", "dep:serde_derive"]
cli = ["dep:clap", "dep:tempfile"]
